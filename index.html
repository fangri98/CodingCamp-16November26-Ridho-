<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Header: Greeting, Date/Time clock, theme toggle, and user-name control -->
  <header class="dashboard-header">
    <div class="header-top">
      <div class="header-titles">
        <h1 id="greeting">Hello!</h1>
        <div id="clock" aria-live="polite" aria-atomic="true"></div>
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle light and dark theme">
        Theme
      </button>
    </div>

    <!-- User-name input: set a custom greeting name and clear it -->
    <form id="user-name-form" class="user-name-form" autocomplete="off">
      <label for="user-name-input">Your name</label>
      <input id="user-name-input" type="text" placeholder="Enter your name" />
      <button id="user-name-submit" type="submit">Set Name</button>
      <button id="user-name-clear" type="button">Clear Name</button>
    </form>
  </header>

  <!-- Main dashboard content -->
  <main class="dashboard-main">

    <!-- Focus timer section -->
    <section id="focus-timer-section" class="panel" aria-labelledby="focus-timer-title">
      <h2 id="focus-timer-title">Focus Timer</h2>
      <p id="focus-timer-display" class="focus-timer-display" role="timer" aria-label="Time remaining">25:00</p>
      <p id="focus-timer-status" class="focus-timer-status" aria-live="polite">Ready to focus.</p>
      <form id="pomodoro-time-form" class="pomodoro-time-form" autocomplete="off">
        <label for="pomodoro-minutes">Minutes</label>
        <input id="pomodoro-minutes" type="number" min="1" max="180" value="25" inputmode="numeric" />
        <button id="set-pomodoro-time" type="submit" class="btn-secondary">Set</button>
      </form>
      <div class="focus-timer-controls">
        <button id="start-timer" class="btn-primary" type="button">Start</button>
        <button id="stop-timer" class="btn-secondary" type="button" disabled>Stop</button>
        <button id="reset-timer" class="btn-secondary" type="button">Reset</button>
      </div>
    </section>

    <!-- Task section -->
    <section id="task-section" class="panel" aria-labelledby="task-section-title">
      <h2 id="task-section-title">Tasks</h2>

      <form id="task-form" class="add-form" autocomplete="off">
        <label for="task-input" class="sr-only">Task name</label>
        <input id="task-input" type="text" placeholder="Add a new task..." />
        <button type="submit">Add</button>
      </form>

      <p id="duplicate-message" class="message message-error" hidden></p>
      <div class="task-sort-control">
        <label for="task-sort">Sort tasks</label>
        <select id="task-sort">
          <option value="added">Added order</option>
          <option value="name-asc">Name: A-Z</option>
          <option value="name-desc">Name: Z-A</option>
          <option value="active-first">Incomplete first</option>
          <option value="completed-first">Completed first</option>
        </select>
      </div>

      <ul id="task-list" class="item-list" aria-label="Task list"></ul>
      <p id="task-empty-state" class="empty-state">No tasks yet. Add one above!</p>
    </section>

    <!-- Quick-link section -->
    <section id="quick-link-section" class="panel" aria-labelledby="quick-link-section-title">
      <h2 id="quick-link-section-title">Quick Links</h2>

      <form id="quick-link-form" class="add-form" autocomplete="off">
        <label for="quick-link-title">Title</label>
        <input id="quick-link-title" type="text" placeholder="Link title" />
        <label for="quick-link-url">URL</label>
        <input id="quick-link-url" type="text" placeholder="example.com" />
        <button type="submit">Add Link</button>
      </form>

      <ul id="quick-link-list" class="item-list" aria-label="Quick link list"></ul>
      <p id="quick-link-empty-state" class="empty-state">No quick links yet. Add one above!</p>
    </section>

  </main>

  <script src="./js/script.js"></script>
</body>
</html>
